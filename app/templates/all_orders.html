
{% extends "base.html" %}

{% block title %}Заявки{% endblock %}

{% block content %}

<div class="container">
    <h2>Список заявок</h2>

    <a href="/orders/create" class="btn">Создать заявку</a>

    {% for order in orders %}
        <div class="order">
            <h3>{{ order.title }}</h3>

            <p>{{ order.description }}</p>

            <p>Статус: {{ order.status }}</p>

            <a href="/orders/{{ order.id }}">Подробнее</a>
        </div>
    {% else %}
        <p>Заявок пока нет.</p>
    {% endfor %}
</div>

{% endblock %}
