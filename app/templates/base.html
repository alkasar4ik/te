
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ServiceDesk Plus{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            min-height: 100vh;
        }

        header {
            background: #1f2937;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #374151;
        }

        header h1 {
            color: #60a5fa;
            font-size: 24px;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        nav a:hover {
            color: #60a5fa;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .container {
            background: #1f2937;
            padding: 25px;
            border-radius: 12px;
        }

        h2 {
            margin-bottom: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #374151;
            background: #111827;
            color: white;
        }

        button, .btn {
            display: inline-block;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
        }

        button:hover, .btn:hover {
            background: #2563eb;
        }

        .order {
            background: #111827;
            padding: 18px;
            margin-top: 15px;
            border-radius: 8px;
        }

        .error {
            color: #f87171;
            margin-bottom: 15px;
        }

        
    </style>
</head>

<body>


<header>
    <h1>ServiceDesk Plus</h1>

    <nav>
        {% if request.session.get("user_id") %}

            <a href="/orders/">Заявки</a>
            <a href="/orders/create">Створити заявку</a>
            <a href="/orders/accepted">Прийняті заявки</a>
            <a href="/users/logout">Вийти</a>

        {% else %}

            <a href="/users/login">Увійти</a>
            <a href="/users/register">Реєстрація</a>

        {% endif %}
    </nav>
</header>


<main>
    {% block content %}{% endblock %}
</main>

</body>
</html>
