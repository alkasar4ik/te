<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Замовлення #{{ order.id }}</title>
</head>
<body>
    <h1>Замовлення #{{ order.id }}: {{ order.title }}</h1>
    
    <p><strong>Статус:</strong> {{ order.status }}</p>
    <p><strong>Опис:</strong></p>
    <p>{{ order.description }}</p>

    <hr>

    <!-- Кнопка прийняття, якщо статус pending -->
    {% if order.status == 'pending' %}
        <form action="/orders/{{ order.id }}/accept" method="post" style="display:inline;">
            <button type="submit">Прийняти замовлення</button>
        </form>
    {% endif %}

    <!-- Кнопка закриття, якщо статус accepted -->
    {% if order.status == 'accepted' %}
        <form action="/orders/{{ order.id }}/close" method="post" style="display:inline;">
            <button type="submit">Закрити замовлення</button>
        </form>
    {% endif %}

    <br><br>
    <a href="/orders/">До списку нових</a> | 
    <a href="/orders/accepted">До списку прийнятих</a>
</body>
</html>
