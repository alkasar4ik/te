<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Замовлення{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 820px;
            margin: 32px auto;
            padding: 0 16px;
            line-height: 1.5;
        }
        nav {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }
        nav a {
            text-decoration: none;
            font-weight: 500;
        }
        hr {
            border: 0;
            border-top: 1px solid #ddd;
            margin: 16px 0;
        }
        .order-list {
            padding-left: 20px;
        }
        .order-list li {
            margin-bottom: 10px;
        }
        .field {
            margin-bottom: 14px;
        }
        .field label {
            display: inline-block;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .field input[type="text"],
        .field textarea {
            width: 100%;
            max-width: 520px;
            padding: 8px;
            box-sizing: border-box;
        }
        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 16px 0;
        }
        button {
            padding: 8px 14px;
            cursor: pointer;
        }
        .back-links {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/orders/">Очікують (Pending)</a>
        <a href="/orders/accepted">Прийняті (Accepted)</a>
        <a href="/orders/create">Створити замовлення</a>
    </nav>
    <hr>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
