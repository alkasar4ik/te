<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Створити замовлення</title>
</head>
<body>
    <h1>Нове замовлення</h1>
    
    <form action="/orders/create" method="post">
        <div>
            <label for="title">Назва замовлення / проблема:</label><br>
            <input type="text" id="title" name="title" required>
        </div>
        <br>
        <div>
            <label for="description">Детальний опис:</label><br>
            <textarea id="description" name="description" rows="4" required></textarea>
        </div>
        <br>
        <button type="submit">Відправити замовлення</button>
    </form>
    
    <br>
    <a href="/orders/">Назад до списку</a>
</body>
</html>
