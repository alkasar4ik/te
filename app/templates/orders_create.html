
{% extends "base.html" %}

{% block title %}Создание заявки{% endblock %}

{% block content %}

<div class="container">
    <h2>Создать заявку</h2>

    <form action="/orders/create" method="post">
        <input type="text" name="title" placeholder="Название заявки" required>

        <textarea name="description" placeholder="Описание заявки" rows="5"></textarea>

        <button type="submit">Создать</button>
    </form>

    <a href="/orders/">Назад к заявкам</a>
</div>

{% endblock %}
